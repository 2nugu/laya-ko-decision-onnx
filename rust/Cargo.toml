[package]
name = "laya-ko"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
